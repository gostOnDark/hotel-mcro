<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<head>
    <meta charset="UTF-8">
    <title>酒店管理系统</title>
    <!--<link rel="stylesheet" href="/webjars/bootstrap/4.6.0/css/bootstrap.min.css"/>-->
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.css"/>
</head>
<body>
<div class="text-center"><h1>酒店客房管理系统</h1></div>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header">登录</div>
                <div class="card-body">
                    <form action="/userLogin" method="POST">
                        <div class="form-group">
                            <label for="username">用户名:</label>
                            <input type="text" id="username" name="username" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="password">密码:</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <span style="color:red" th:text="${msg}"></span>
                        <div>
                            <input type="checkbox" name="rememberme" id="remember-me" value="true" />
                            <label for="remember-me">在这台电脑上记住我</label>
                        </div>
                        <button type="submit" class="btn btn-primary">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!--<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>-->
<!--<script th:src="@{/webjars/bootstrap/4.6.0/js/bootstrap.min.js}"></script>-->
<script src="/static/jquery.js"></script>
<script src="/static/bootstrap/js/bootstrap.js"></script>
</body>
</html>
